name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for manual runs)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  android:
    name: Android APK and App Bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and shader compiler
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y glslc

      - name: Build Android packages
        env:
          PRIVATELM_ALLOW_DEBUG_RELEASE_SIGNING: 'true'
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          flutter pub get
          inappwebview_gradle="$PUB_CACHE/hosted/pub.dev/flutter_inappwebview_android-1.1.3/android/build.gradle"
          if [ -f "$inappwebview_gradle" ]; then
            sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$inappwebview_gradle"
          fi
          for package in apk appbundle; do
            for attempt in 1 2 3 4 5; do
              if flutter build "$package" --release; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              sleep $((attempt * 10))
            done
          done

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  linux:
    name: Linux desktop bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libvulkan-dev vulkan-tools spirv-headers spirv-tools glslc

      - name: Build Linux bundle
        run: |
          flutter pub get
          flutter build linux --release
          tar -C build/linux/x64/release -czf privatelm-linux-x64.tar.gz bundle

      - name: Package Linux AppImage
        run: |
          set -euxo pipefail
          app_dir="$PWD/AppDir"
          mkdir -p "$app_dir/usr/bin" \
            "$app_dir/usr/share/applications" \
            "$app_dir/usr/share/icons/hicolor/512x512/apps"
          cp -a build/linux/x64/release/bundle/. "$app_dir/usr/bin/"
          cp assets/icons/appicon.png \
            "$app_dir/usr/share/icons/hicolor/512x512/apps/privatelm.png"
          cat > "$app_dir/usr/share/applications/privatelm.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=PrivateLM
          Comment=Local and cloud LLM assistant
          Exec=privatelm
          Icon=privatelm
          Categories=Utility;
          Terminal=false
          EOF
          curl --fail --location --retry 5 \
            --output appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool.AppImage "$app_dir" privatelm-linux-x86_64.AppImage

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            privatelm-linux-x64.tar.gz
            privatelm-linux-x86_64.AppImage

  windows:
    name: Windows desktop bundle
    runs-on: windows-2022
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Windows bundle
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          flutter pub get
          flutter build windows --release
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath privatelm-windows-x64.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: privatelm-windows-x64.zip

  publish:
    name: Publish GitHub release
    needs: [android, linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    steps:
      - name: Download Android packages
        uses: actions/download-artifact@v4
        with:
          name: android-packages
          path: release

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: release

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release

      - name: Normalize release filenames
        run: |
          mv release/flutter-apk/app-release.apk release/app-release.apk
          mv release/bundle/release/app-release.aab release/app-release.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/app-release.apk
            release/app-release.aab
            release/privatelm-linux-x64.tar.gz
            release/privatelm-linux-x86_64.AppImage
            release/privatelm-windows-x64.zip
